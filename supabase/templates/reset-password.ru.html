<!-- subject: Восстановление пароля TezHR -->
<!DOCTYPE html>
<html>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f1ea; margin: 0; padding: 24px;">
  <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; border: 1px solid #e7e0d1;">
    <div style="font-weight: 700; font-size: 15px; letter-spacing: 0.02em; color: #1c1b1f; margin-bottom: 16px;">TezHR</div>
    <h2 style="margin: 0 0 8px; color: #1c1b1f; font-size: 20px;">Сброс пароля</h2>
    <p style="color: #49454f; margin: 0 0 24px; font-size: 14px; line-height: 1.5;">
      Кто-то запросил сброс пароля для <strong>{{ .Email }}</strong>. Нажмите кнопку ниже, чтобы задать новый.
    </p>
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; background: #b54a1f; color: #ffffff; padding: 12px 24px; border-radius: 100px; text-decoration: none; font-weight: 500; font-size: 14px;">
      Задать новый пароль
    </a>
    <p style="color: #79747e; font-size: 12px; margin-top: 24px; line-height: 1.4;">
      Если это были не вы — проигнорируйте письмо, текущий пароль продолжит работать. Ссылка действует 1 час.
    </p>
    <p style="color: #79747e; font-size: 11.5px; margin-top: 28px; line-height: 1.4;">
      TezHR · support@tezhr.uz
    </p>
  </div>
</body>
</html>
